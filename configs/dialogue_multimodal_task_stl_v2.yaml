seed: 13

run:
  enabled: true
  group: dialogue_multimodal_task_stl_v2
  name: s5_multimodal_task_stl
  reuse_existing: true

data:
  data_root_mode: auto
  server_data_root: /data2/yangxy/dataset/MELD/MELD.Raw
  local_data_root: ../MELD-master/data/MELD
  stl_task_split_root: stl_task_splits
  eval_split: test
  warn_missing_videos: true

tasks:
  order: [sentiment, emotion, shift]

modalities:
  order: [text, audio, visual]
  active_modalities: [text, audio, visual]
  feature_root: outputs/features_v2
  feature_dims:
    text: 1024
    audio: 6373
    visual: 2048

model:
  modality_projection_dim: 256
  normalize_modality_inputs: true
  modality_activation_negative_slope: 0.01
  speaker_embedding: true
  speaker_embedding_dim: 32
  fusion_hidden_dim: 256
  fusion_output_dim: 256
  dialogue_encoder: true
  dialogue_hidden_dim: 256
  dialogue_num_layers: 2
  dropout: 0.3

train:
  output_dir: outputs
  device: auto
  batch_size: 16
  epochs: 30
  eval_interval: 10
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  num_workers: 0

continual:
  seed: 13
  sampler: weighted_random
  lambda_kd: 1.0
  lambda_rel: 1.0
  lambda_cmd: 1.0
  temperature: 2.0
  memory_per_class: 100

feature_paths:
  feature_set: final_v2
  feature_root: outputs/features_v2
  text_model_path: /data2/yangxy/models/xlm-roberta-large
  visual_model_path: torchvision:resnet50
